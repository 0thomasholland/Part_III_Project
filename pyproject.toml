[project]
name = "Part_III_Project"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = "~=3.12.0"
authors = [
  { name = "Thomas Holland", email = "101332229+0thomasholland@users.noreply.github.com" },
]
dependencies = [
  "matplotlib",
  "mpltern",
  "numpy",
  "pandas",
  "pygeoinf",
  "pyslfp",
  "jupyter",
  "ipykernel",
  "jupytext",
  "ruff",
  "statsmodels",
  "ty",
  "pynvim",
  "jupyter-client",
  "notebook"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
  { include = "project", from = "src" },
  { include = "pyslfp_extras", from = "src" },
  { include = "pygeoinf_extras", from = "src" }
]

[tool.ruff]
target-version = "py312"
line-length = 60
src = ["src"]

[tool.ruff.lint]
select = [
  "F",  # Pyflakes (correctness)
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "I",  # isort (import sorting)
  "B",  # flake8-bugbear (catches common bugs like mutable defaults)
  "UP",  # pyupgrade (upgrades code to modern Python 3.12 syntax)
  "SIM",  # flake8-simplify (helps you write cleaner code)
  "N",  # pep8-naming (enforces standard function/class names)
]
extend-select = [
  "ANN",  # flake8-annotations (type hints)
  "TID",  # flake8-tidy-imports (cleaner import structures)
  "RUF",  # Ruff-specific rules (ambiguous characters, etc.)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["ANN201", "ANN204"]
"tests/*" = ["ANN"]  # Don't require strict types in tests

[tool.ty]
